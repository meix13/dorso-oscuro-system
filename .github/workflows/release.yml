name: Crear Release de FoundryVTT

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from system.json
        id: get_version
        run: |
          VERSION=$(jq -r '.version' system.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Create dorso_oscuro.zip
        run: |
          zip -r dorso_oscuro.zip \
            system.json \
            template.json \
            assets \
            cartas \
            css \
            module \
            packs \
            templates \
            -x "*.git*" "*.idea*"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || steps.get_version.outputs.tag }}
          name: "Dorso Oscuro ${{ steps.get_version.outputs.tag }}"
          generate_release_notes: true
          files: |
            system.json
            dorso_oscuro.zip
